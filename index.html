<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu Audio - Elven Web3 Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .elven-font { font-family: 'Cinzel', serif; }
    .gold-glow { text-shadow: 0 0 10px rgba(234, 179, 8, 0.3); }
    .emerald-border { border-color: rgba(16, 185, 129, 0.2); }
  </style>
</head>
<body class="bg-slate-950 text-emerald-100/90 min-h-screen flex flex-col md:flex-row pb-28">

  <!-- BARRA LATERAL (Menú Elfico con muchas opciones) -->
  <aside class="w-full md:w-64 bg-slate-900/80 border-r border-emerald-900/40 p-5 flex flex-col justify-between shrink-0 backdrop-blur-md">
    <div class="space-y-6">
      <!-- Logo Élfico -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-600 to-amber-400 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-900/50">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-amber-300 elven-font gold-glow tracking-wider">NIMBU</h1>
          <p class="text-[10px] text-emerald-500 uppercase tracking-widest">Audio Místico Web3</p>
        </div>
      </div>

      <!-- Menú de Opciones de Carga -->
      <nav class="space-y-2">
        <p class="text-[10px] font-bold text-amber-500/70 uppercase tracking-widest px-2">Explorar Fuentes</p>
        
        <button onclick="fetchHive('music', 'Comunidad de Música')" class="w-full text-left px-3 py-2.5 rounded-lg bg-emerald-950/30 hover:bg-emerald-900/40 border emerald-border text-xs font-semibold text-emerald-200 transition flex items-center gap-2">
          <i data-lucide="music" class="w-4 h-4 text-amber-400"></i> Hive Music
        </button>

        <button onclick="fetchHive('3speak', 'Colección 3Speak')" class="w-full text-left px-3 py-2.5 rounded-lg bg-emerald-950/30 hover:bg-emerald-900/40 border emerald-border text-xs font-semibold text-emerald-200 transition flex items-center gap-2">
          <i data-lucide="video" class="w-4 h-4 text-emerald-400"></i> 3Speak Feeds
        </button>

        <button onclick="fetchHive('podcast', 'Podcasts Web3')" class="w-full text-left px-3 py-2.5 rounded-lg bg-emerald-950/30 hover:bg-emerald-900/40 border emerald-border text-xs font-semibold text-emerald-200 transition flex items-center gap-2">
          <i data-lucide="mic" class="w-4 h-4 text-amber-400"></i> Podcasts
        </button>

        <button onclick="fetchHive('soundlegion', 'SoundLegion')" class="w-full text-left px-3 py-2.5 rounded-lg bg-emerald-950/30 hover:bg-emerald-900/40 border emerald-border text-xs font-semibold text-emerald-200 transition flex items-center gap-2">
          <i data-lucide="radio" class="w-4 h-4 text-emerald-400"></i> SoundLegion
        </button>

        <hr class="border-emerald-900/30 my-4">

        <button onclick="importPinataFiles()" class="w-full text-left px-3 py-2.5 rounded-lg bg-amber-950/20 hover:bg-amber-900/30 border border-amber-900/30 text-xs font-semibold text-amber-300 transition flex items-center gap-2">
          <i data-lucide="database" class="w-4 h-4 text-amber-400"></i> Importar de Pinata
        </button>
      </nav>
    </div>

    <div class="text-[10px] text-emerald-700 text-center pt-4">
      ✦ Creado para la Red Mística ✦
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
    <div class="flex justify-between items-end border-b border-emerald-900/30 pb-4">
      <div>
        <h2 id="currentCategory" class="text-xl font-bold text-amber-200 elven-font">Selecciona un Cantar</h2>
        <p id="statusMsg" class="text-xs text-emerald-500">Haz clic en una opción del menú lateral para invocar las pistas...</p>
      </div>
      <button onclick="clearPlaylist()" class="text-xs text-amber-500/70 hover:text-amber-400 flex items-center gap-1">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Limpiar
      </button>
    </div>

    <!-- Lista de Reproducción -->
    <div id="playlist" class="space-y-3">
      <div class="text-center py-12 text-emerald-800">
        <i data-lucide="feather" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>
        <p class="text-sm elven-font">El ecosistema está en silencio.</p>
      </div>
    </div>
  </main>

  <!-- REPRODUCTOR FIJO ÉLFICO -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/90 border-t border-emerald-900/50 p-4 backdrop-blur-lg z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="w-1/2">
        <div id="playerTitle" class="text-sm font-bold text-amber-200 elven-font truncate">Silencio en los Bosques</div>
        <div id="playerAuthor" class="text-[10px] text-emerald-500">---</div>
      </div>
      
      <div class="flex items-center gap-4">
        <button onclick="skip(-1)" class="p-2 hover:bg-emerald-950/50 text-emerald-400 rounded-full transition">
          <i data-lucide="skip-back" class="w-5 h-5"></i>
        </button>
        <button id="mainPlayBtn" onclick="togglePlay()" class="p-3 bg-gradient-to-tr from-emerald-600 to-amber-500 text-slate-950 font-bold rounded-full shadow-lg shadow-emerald-900/40 hover:scale-105 transition">
          <i data-lucide="play" class="w-5 h-5"></i>
        </button>
        <button onclick="skip(1)" class="p-2 hover:bg-emerald-950/50 text-emerald-400 rounded-full transition">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <audio id="audioEngine" class="hidden"></audio>
  </footer>

  <script>
    let playlist = [];
    let curIdx = 0;
    const audio = document.getElementById('audioEngine');
    const playBtn = document.getElementById('mainPlayBtn');
    let hls = null;

    // CONSULTA A HIVE (Muestra las publicaciones con metadatos o audios adjuntos)
    async function fetchHive(tag, name) {
      document.getElementById('currentCategory').innerText = name;
      document.getElementById('statusMsg').innerText = `Invocando ecos de #${tag}...`;

      try {
        const response = await fetch('https://api.hive.blog', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: "2.0",
            method: "condenser_api.get_discussions_by_created",
            params: [{ tag: tag, limit: 30 }],
            id: 1
          })
        });

        const { result } = await response.json();
        const extracted = [];

        result.forEach(post => {
          try {
            const meta = JSON.parse(post.json_metadata || "{}");
            let mediaUrl = null;

            // Detección de video/audio 3Speak
            if (meta.video && meta.video.info) {
              if (meta.video.info.ipfs) {
                mediaUrl = `https://ipfs.io/ipfs/${meta.video.info.ipfs}`;
              } else if (meta.video.info.file) {
                const permlink = meta.video.info.file.replace('.m3u8', '');
                mediaUrl = `https://encoder.3speak.tv/play?v=${post.author}/${permlink}`;
              }
            } 
            
            // Búsqueda de enlaces mp3/wav en el texto si no está en metadatos
            if (!mediaUrl) {
              const audioMatch = post.body.match(/https?:\/\/[^\s"']+\.(mp3|wav|ogg|m3u8)/i);
              if (audioMatch) mediaUrl = audioMatch[0];
            }

            if (mediaUrl) {
              extracted.push({
                title: post.title,
                author: "@" + post.author,
                url: mediaUrl,
                source: name
              });
            }
          } catch (e) {}
        });

        if (extracted.length > 0) {
          extracted.forEach(t => {
            if (!playlist.some(p => p.url === t.url)) playlist.push(t);
          });
          renderList();
          document.getElementById('statusMsg').innerText = `✦ Se han hallado ${extracted.length} pergaminos con sonido.`;
        } else {
          document.getElementById('statusMsg').innerText = "No se encontraron audios directos en las publicaciones recientes.";
        }
      } catch (e) {
        document.getElementById('statusMsg').innerText = "Error al conectar con los reinos de Hive.";
      }
    }

    // PINATA (Soporte directo de JWT o API Key)
    async function importPinataFiles() {
      const jwt = prompt("Ingresa tu Pinata JWT Token:");
      if (!jwt) return;

      document.getElementById('statusMsg').innerText = "Abriendo cofre de Pinata...";

      try {
        const response = await fetch("https://api.pinata.cloud/data/pinList?status=pinned&pageLimit=100", {
          method: "GET",
          headers: { "Authorization": `Bearer ${jwt.trim().replace('Bearer ', '')}` }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        const pinataTracks = data.rows.map(item => ({
          title: item.metadata?.name || item.ipfs_pin_hash,
          author: "Tu Cofre IPFS",
          url: `https://gateway.pinata.cloud/ipfs/${item.ipfs_pin_hash}`,
          source: "Pinata"
        }));

        pinataTracks.forEach(t => {
          if (!playlist.some(p => p.url === t.url)) playlist.push(t);
        });

        renderList();
        document.getElementById('statusMsg').innerText = `✦ Se importaron ${pinataTracks.length} reliquias de Pinata.`;

      } catch (e) {
        alert("Error al acceder a Pinata. Revisa las llaves o permisos.");
      }
    }

    function renderList() {
      const container = document.getElementById('playlist');
      if (playlist.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-emerald-800"><p class="text-sm elven-font">Lista vacía.</p></div>`;
        return;
      }

      container.innerHTML = playlist.map((t, i) => `
        <div class="p-3.5 bg-slate-900/60 rounded-xl border border-emerald-900/30 hover:border-amber-500/40 transition flex justify-between items-center group backdrop-blur-sm">
          <div class="truncate mr-4">
            <h3 class="text-sm font-bold text-emerald-100 truncate group-hover:text-amber-200 transition">${t.title}</h3>
            <p class="text-[10px] text-emerald-500">${t.source} • <span class="text-amber-400/80">${t.author}</span></p>
          </div>
          <button onclick="playTrack(${i})" class="text-xs bg-emerald-950 hover:bg-emerald-800 text-amber-300 px-3.5 py-1.5 rounded-lg border border-emerald-800 transition shrink-0 flex items-center gap-1.5 font-semibold">
            <i data-lucide="play" class="w-3 h-3"></i> Entonar
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    async function playTrack(i) {
      curIdx = i;
      const track = playlist[i];
      document.getElementById('playerTitle').innerText = track.title;
      document.getElementById('playerAuthor').innerText = `${track.source} • ${track.author}`;

      audio.onerror = () => {
        document.getElementById('playerTitle').innerText = "❌ Transmisión no disponible o bloqueada";
        playBtn.innerHTML = '<i data-lucide="play" class="w-5 h-5"></i>';
      };

      if (Hls.isSupported() && track.url.includes('.m3u8')) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(track.url);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
      } else {
        if (hls) hls.destroy();
        audio.src = track.url;
        await audio.play();
      }

      playBtn.innerHTML = '<i data-lucide="pause" class="w-5 h-5"></i>';
      lucide.createIcons();
    }

    function togglePlay() {
      if (audio.paused) { 
        audio.play(); 
        playBtn.innerHTML = '<i data-lucide="pause" class="w-5 h-5"></i>'; 
      } else { 
        audio.pause(); 
        playBtn.innerHTML = '<i data-lucide="play" class="w-5 h-5"></i>'; 
      }
      lucide.createIcons();
    }

    function skip(s) {
      if (playlist.length === 0) return;
      let next = (curIdx + s + playlist.length) % playlist.length;
      playTrack(next);
    }

    function clearPlaylist() {
      playlist = [];
      renderList();
      document.getElementById('statusMsg').innerText = "Lista despejada.";
    }

    lucide.createIcons();
  </script>
</body>
</html>
