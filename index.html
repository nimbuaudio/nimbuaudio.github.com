<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu - Debug Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  
  <style>
    body { font-family: 'Inter', sans-serif; padding-bottom: 140px; background-color: #0a0e09; }
    .card-elven { background: linear-gradient(135deg, #1e261c 0%, #141912 100%); border: 1px solid #453010; }
  </style>
</head>
<body class="text-[#e5dcc3]">

  <!-- Header -->
  <header class="border-b border-amber-900/40 p-4 sticky top-0 bg-[#0a0e09]/90 z-40">
    <h1 class="text-xl font-black text-amber-500">Nimbu <span class="text-[10px] text-amber-800">Debug V2</span></h1>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    <div id="feed" class="grid grid-cols-1 gap-4">
        <p id="loadingMsg" class="text-center text-amber-700 animate-pulse">Cargando y verificando streams...</p>
    </div>
  </main>

  <footer class="fixed bottom-0 w-full bg-black border-t border-amber-900 p-4 z-50">
    <div class="max-w-xl mx-auto flex items-center justify-between">
        <div id="statusIndicator" class="text-[10px] text-red-500 font-mono">No playing</div>
        <div class="flex gap-4">
            <button onclick="togglePlay()" class="bg-amber-600 p-3 rounded-full"><i data-lucide="play-pause" class="w-6 h-6"></i></button>
            <button onclick="changeTrack(1)" class="text-amber-500"><i data-lucide="skip-forward" class="w-6 h-6"></i></button>
        </div>
    </div>
    <audio id="globalAudio"></audio>
  </footer>

  <script>
    lucide.createIcons();
    let audioQueue = [];
    let currentIdx = 0;
    const player = document.getElementById('globalAudio');
    const status = document.getElementById('statusIndicator');

    // 1. Filtrado Estricto: Solo aceptamos archivos multimedia reales
    function findBestAudioUrl(post) {
        const urlRegex = /(https?:\/\/[^\s"']+\.(mp3|wav|aac|ogg))/gi;
        const bodyMatch = post.body.match(urlRegex);
        if (bodyMatch) return bodyMatch[0];
        
        let meta = {};
        try { meta = JSON.parse(post.json_metadata); } catch(e) {}
        
        if (meta?.audio && meta.audio.match(/\.(mp3|wav|aac|ogg)$/)) return meta.audio;
        return null;
    }

    async function loadHivePosts() {
        const tags = ["music", "audio"];
        try {
            const responses = await Promise.all(tags.map(tag => 
                fetch('https://api.hive.blog', {
                    method: 'POST',
                    body: JSON.stringify({ jsonrpc: "2.0", method: "condenser_api.get_discussions_by_created", params: [{tag, limit: 10}], id: 1 }),
                    headers: { 'Content-Type': 'application/json' }
                }).then(r => r.json())
            ));

            audioQueue = responses.flatMap(r => r.result || [])
                .map(p => ({ ...p, audioUrl: findBestAudioUrl(p) }))
                .filter(p => !!p.audioUrl);

            if(audioQueue.length === 0) {
                document.getElementById('loadingMsg').innerText = "No se hallaron archivos de audio válidos (mp3/wav).";
            } else {
                renderFeed();
            }
        } catch(e) { console.error(e); }
    }

    function renderFeed() {
        document.getElementById('feed').innerHTML = audioQueue.map(p => `
            <div class="card-elven p-4 rounded-lg">
                <h3 class="text-sm font-bold text-amber-500">${p.title}</h3>
                <button onclick="playTrack('${p.permlink}')" class="mt-2 text-[10px] bg-amber-900/50 px-2 py-1 rounded">PROBAR AUDIO</button>
            </div>
        `).join('');
    }

    // 2. Player con diagnóstico de errores
    function playTrack(permlink) {
        const post = audioQueue.find(p => p.permlink === permlink);
        if(!post) return;
        
        player.src = post.audioUrl;
        status.innerText = "Cargando...";
        
        // Diagnóstico en consola
        player.onerror = (e) => {
            status.innerText = "Error: " + e.target.error.code;
            console.error("Error cargando archivo:", post.audioUrl, e);
        };

        player.onplay = () => status.innerText = "Reproduciendo";
        
        player.play().catch(err => {
            status.innerText = "Bloqueado (Toca el play)";
            console.warn("Autoplay bloqueado, el usuario debe interactuar:", err);
        });
    }

    function togglePlay() {
        if(player.paused) player.play();
        else player.pause();
    }

    function changeTrack(step) {
        currentIdx = (currentIdx + step + audioQueue.length) % audioQueue.length;
        playTrack(audioQueue[currentIdx].permlink);
    }

    loadHivePosts();
  </script>
</body>
</html>
