<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu - Comparte tu Voz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@hiveio/dhive@latest/dist/dhive.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; padding-bottom: 120px; } /* Espacio extra para el player fijo */
    h1, h2, h3 { font-family: 'Poppins', sans-serif; }
    
    .elven-bg { background: radial-gradient(circle at 50% 10%, #1c251a 0%, #0a0e09 100%); }
    .border-elven { border: 1px solid rgba(184, 153, 90, 0.25); }
    .gold-glow { text-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
    .card-elven {
        background: linear-gradient(135deg, rgba(30, 38, 28, 0.9) 0%, rgba(20, 25, 18, 0.95) 100%);
        transition: transform 0.2s;
    }
    .card-elven:hover { transform: translateY(-4px); }
    
    /* Estilo del Player */
    input[type=range] { accent-color: #d97706; cursor: pointer; }
  </style>
</head>
<body class="bg-[#0a0e09] text-[#e5dcc3] min-h-screen elven-bg selection:bg-amber-900/50">

  <!-- Header -->
  <header class="border-b border-amber-900/40 bg-[#0a0e09]/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar(true)" class="p-2 rounded-xl border border-amber-800/40 hover:bg-amber-900/20 transition active:scale-95">
          <i data-lucide="menu" class="w-5 h-5 text-amber-600"></i>
        </button>
        <div class="flex items-center gap-3">
          <div class="bg-amber-900/20 p-2 rounded-lg border border-amber-700/30 text-amber-600">
            <i data-lucide="leaf" class="w-5 h-5"></i>
          </div>
          <div class="leading-none">
            <h1 class="text-xl font-black text-amber-500 gold-glow tracking-wide">Nimbu</h1>
            <span class="text-[9px] font-serif text-amber-700/90 italic tracking-wider">Comparte tu Voz</span>
          </div>
        </div>
      </div>
      <div id="authContainer">
        <button id="loginBtn" onclick="connectHiveKeychain()" class="border border-amber-700/50 text-amber-200 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-amber-900/30 transition-all flex items-center gap-1.5">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i> Conectar
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar (omitido por brevedad, igual al anterior) -->
  <div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50"></div>
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-[#0f140d] border-r border-amber-900/50 z-50 transform -translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between overflow-y-auto">
    <!-- ... (mismo contenido de navegación) ... -->
    <div class="text-center text-stone-600 text-xs italic">El saber antiguo fluye eterno</div>
  </aside>

  <!-- Contenido -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-8 border-b border-amber-900/30 pb-4">
        <h2 class="text-2xl font-black text-amber-400 tracking-tight">Hoy Suena:</h2>
    </div>
    <div id="feed" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="col-span-full py-20 text-center text-amber-800">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
            <p class="text-sm italic">Recibiendo los mensajes del viento...</p>
        </div>
    </div>
  </main>

  <!-- PLAYER FIJO INFERIOR -->
  <footer class="fixed bottom-0 left-0 right-0 bg-[#0a0e09]/95 border-t border-amber-900/50 backdrop-blur-lg z-50 p-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-6">
        <div class="flex-1 min-w-0">
            <h4 id="playerTitle" class="text-xs font-bold text-amber-500 truncate">Ningún audio seleccionado</h4>
        </div>
        
        <div class="flex items-center gap-4">
            <button onclick="playRandom()" class="text-amber-700 hover:text-amber-400 transition"><i data-lucide="shuffle" class="w-5 h-5"></i></button>
            <button onclick="changeTrack(-1)" class="text-amber-500 hover:text-amber-300"><i data-lucide="skip-back" class="w-5 h-5"></i></button>
            <button id="playPauseBtn" onclick="togglePlay()" class="bg-amber-600 text-black p-3 rounded-full hover:bg-amber-500"><i data-lucide="play" class="w-6 h-6"></i></button>
            <button onclick="changeTrack(1)" class="text-amber-500 hover:text-amber-300"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
        </div>

        <div class="flex items-center gap-2 w-32">
            <i data-lucide="volume-2" class="w-4 h-4 text-amber-700"></i>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)" class="w-full">
        </div>
    </div>
    <audio id="globalAudio" onended="changeTrack(1)"></audio>
  </footer>

  <script>
    lucide.createIcons();
    let audioQueue = [];
    let currentIdx = 0;
    const player = document.getElementById('globalAudio');
    const playerTitle = document.getElementById('playerTitle');
    const playPauseBtn = document.getElementById('playPauseBtn');

    // Cargar posts
    async function loadHivePosts() {
        try {
            const hiveClient = new dhive.Client(['https://api.hive.blog'], { timeout: 4000 });
            const posts = await hiveClient.database.getDiscussions('created', { tag: 'music', limit: 20 });
            
            // Filtrar solo los que tienen audio
            audioQueue = posts.filter(p => {
                try {
                    const m = typeof p.json_metadata === 'string' ? JSON.parse(p.json_metadata) : p.json_metadata;
                    return !!m?.audio;
                } catch(e) { return false; }
            });
            renderFeed(posts);
        } catch (e) { console.error(e); }
    }

    function renderFeed(posts) {
        const feed = document.getElementById('feed');
        feed.innerHTML = posts.map((p, idx) => {
            let img = 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=400';
            try { const m = typeof p.json_metadata === 'string' ? JSON.parse(p.json_metadata) : p.json_metadata; if(m?.image?.[0]) img = m.image[0]; } catch(e){}
            
            return `
              <article class="card-elven border-elven rounded-xl p-3">
                <img src="${img}" class="w-full h-24 object-cover rounded-lg mb-3">
                <h3 class="text-[9px] text-amber-600 font-bold uppercase">${p.author}</h3>
                <h2 class="text-xs text-[#e5dcc3] mb-3 leading-tight line-clamp-2">${p.title}</h2>
                <button onclick="loadTrackFromFeed('${p.permlink}')" class="w-full py-2 text-xs font-bold border border-amber-900 rounded-lg hover:bg-amber-900/30 text-amber-500">
                    REPRODUCIR
                </button>
              </article>`;
        }).join('');
    }

    function loadTrackFromFeed(permlink) {
        const idx = audioQueue.findIndex(p => p.permlink === permlink);
        if(idx !== -1) { currentIdx = idx; playTrack(); }
    }

    function playTrack() {
        const post = audioQueue[currentIdx];
        const m = typeof post.json_metadata === 'string' ? JSON.parse(post.json_metadata) : post.json_metadata;
        player.src = m.audio;
        playerTitle.innerText = post.title;
        player.play();
        playPauseBtn.innerHTML = '<i data-lucide="pause" class="w-6 h-6"></i>';
        lucide.createIcons();
    }

    function togglePlay() {
        if(player.paused) { player.play(); playPauseBtn.innerHTML = '<i data-lucide="pause" class="w-6 h-6"></i>'; }
        else { player.pause(); playPauseBtn.innerHTML = '<i data-lucide="play" class="w-6 h-6"></i>'; }
    }

    function changeTrack(step) {
        currentIdx = (currentIdx + step + audioQueue.length) % audioQueue.length;
        playTrack();
    }

    function playRandom() {
        currentIdx = Math.floor(Math.random() * audioQueue.length);
        playTrack();
    }

    function setVolume(val) { player.volume = val; }

    loadHivePosts();
  </script>
</body>
</html>
