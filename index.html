<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@hiveio/dhive@latest/dist/dhive.js"></script>
  <!-- Tipografía Élfica Serif -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3 { font-family: 'Lora', serif; }
    
    /* Fondo: Profundidad de bosque antiguo */
    .elven-bg { background: radial-gradient(circle at 50% 10%, #1c251a 0%, #0a0e09 100%); }
    
    /* Bordes de Bronce envejecido */
    .border-elven { border: 1px solid rgba(184, 153, 90, 0.25); }
    
    /* Efecto "Glow" sutil */
    .gold-glow { text-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
    
    /* Tarjeta con efecto pergamino oscuro */
    .card-elven {
        background: linear-gradient(135deg, rgba(30, 38, 28, 0.9) 0%, rgba(20, 25, 18, 0.95) 100%);
    }
  </style>
</head>
<body class="bg-[#0a0e09] text-[#e5dcc3] min-h-screen elven-bg selection:bg-amber-900/50">

  <!-- Header -->
  <header class="border-b border-amber-900/40 bg-[#0a0e09]/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <!-- Lado Izquierdo -->
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar(true)" class="p-2 rounded-xl border border-amber-800/40 hover:bg-amber-900/20 transition active:scale-95">
          <i data-lucide="menu" class="w-5 h-5 text-amber-600"></i>
        </button>
        
        <div class="flex items-center gap-2">
          <div class="bg-amber-900/20 p-2 rounded-lg border border-amber-700/30 text-amber-600">
            <i data-lucide="leaf" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-amber-500 gold-glow tracking-wide">Nimbu</h1>
            <div class="flex items-center gap-1.5 text-[9px] uppercase tracking-widest text-amber-700">
              <span id="statusNode" class="w-1.5 h-1.5 rounded-full bg-emerald-700 animate-pulse"></span>
              <span>Conexión Estable</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Lado Derecho -->
      <div id="authContainer">
        <button id="loginBtn" onclick="connectHiveKeychain()" class="border border-amber-700/50 text-amber-200 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-amber-900/30 transition-all flex items-center gap-1.5">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i>
          Conectar
        </button>
      </div>
    </div>
  </header>

  <!-- MENÚ LATERAL -->
  <div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50"></div>
  
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-[#0f140d] border-r border-amber-900/50 z-50 transform -translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between">
    <div>
        <div class="flex items-center gap-3 mb-10 pb-6 border-b border-amber-900/30">
            <i data-lucide="crown" class="w-6 h-6 text-amber-600"></i>
            <span class="text-lg font-bold text-amber-500 tracking-wider">Menú Nimbu</span>
        </div>
        <nav class="space-y-2">
            <a href="#" onclick="toggleSidebar(false)" class="flex items-center gap-3 px-3 py-3 rounded-lg bg-amber-900/10 text-amber-500 border border-amber-800/30 text-sm">
                <i data-lucide="compass" class="w-4 h-4"></i> Explorar Crónicas
            </a>
            <button onclick="openMenuSection('Perfil')" class="w-full flex items-center gap-3 px-3 py-3 rounded-lg text-stone-400 hover:text-amber-200 hover:bg-stone-800/30 text-sm transition text-left">
                <i data-lucide="user" class="w-4 h-4"></i> Mi Perfil
            </button>
            <button onclick="openMenuSection('Billetera')" class="w-full flex items-center gap-3 px-3 py-3 rounded-lg text-stone-400 hover:text-amber-200 hover:bg-stone-800/30 text-sm transition text-left">
                <i data-lucide="gem" class="w-4 h-4"></i> Billetera Hive
            </button>
            <button onclick="openMenuSection('Mis Audios')" class="w-full flex items-center gap-3 px-3 py-3 rounded-lg text-stone-400 hover:text-amber-200 hover:bg-stone-800/30 text-sm transition text-left">
                <i data-lucide="music" class="w-4 h-4"></i> Mis Publicaciones
            </button>
        </nav>
    </div>
    <div class="text-[10px] text-stone-600 text-center italic border-t border-amber-900/30 pt-4">
        "El saber antiguo fluye eterno"
    </div>
  </aside>

  <!-- Contenido -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-8 border-b border-amber-900/30 pb-4">
        <h2 class="text-xl text-amber-500 font-serif">Registros de Audio</h2>
    </div>

    <!-- Feed Grid (2 columnas en movil) -->
    <div id="feed" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="col-span-full py-20 text-center text-amber-800">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
            <p class="text-sm font-serif italic">Desempolvando los tomos...</p>
        </div>
    </div>
  </main>

  <!-- Fab -->
  <button id="fabPublish" onclick="toggleModal(true)" class="hidden fixed bottom-8 right-8 bg-amber-900 border border-amber-600 p-4 rounded-full shadow-2xl z-40 hover:bg-amber-800 transition">
    <i data-lucide="plus" class="w-6 h-6 text-amber-200"></i>
  </button>

  <script>
    lucide.createIcons();
    let currentUser = localStorage.getItem('nimbu_user');
    const hiveClient = new dhive.Client(['https://api.hive.blog', 'https://api.deathwing.me'], { timeout: 4000 });

    if (currentUser) setSession(currentUser);
    loadHivePosts();

    function toggleSidebar(open) {
        document.getElementById('sidebar').classList.toggle('-translate-x-full', !open);
        document.getElementById('sidebarBackdrop').classList.toggle('hidden', !open);
    }

    async function loadHivePosts() {
        try {
            const posts = await hiveClient.database.getDiscussions('created', { tag: 'music', limit: 20 });
            renderPosts(posts);
        } catch (e) {
            console.error(e);
        }
    }

    function renderPosts(posts) {
        const feedElement = document.getElementById('feed');
        feedElement.innerHTML = posts.map(post => {
            let img = 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=400';
            try {
                const meta = typeof post.json_metadata === 'string' ? JSON.parse(post.json_metadata) : post.json_metadata;
                if (meta?.image?.[0]) img = meta.image[0];
            } catch(e) {}

            return `
              <article class="card-elven border-elven rounded-xl p-3 flex flex-col justify-between">
                <div>
                    <img src="${img}" class="w-full h-24 object-cover rounded-lg mb-3 opacity-90 border border-amber-900/30">
                    <h3 class="text-[9px] text-amber-600 font-bold uppercase tracking-widest truncate">@${post.author}</h3>
                    <h2 class="text-xs font-serif text-[#e5dcc3] mb-2 leading-tight line-clamp-2">${post.title}</h2>
                </div>
                <div class="border-t border-amber-900/30 pt-2">
                    <a href="https://hive.blog/@${post.author}/${post.permlink}" target="_blank" class="text-[10px] font-bold text-amber-500 hover:text-amber-300">
                        ESCUCHAR »
                    </a>
                </div>
              </article>
            `;
        }).join('');
    }

    function setSession(user) {
      currentUser = user;
      document.getElementById('authContainer').innerHTML = `<span class="text-amber-500 text-xs italic">@${user}</span>`;
      document.getElementById('fabPublish').classList.remove('hidden');
    }

    function connectHiveKeychain() {
        const u = prompt('Usuario de Hive:');
        if (u) { localStorage.setItem('nimbu_user', u.toLowerCase()); setSession(u.toLowerCase()); }
    }
  </script>
</body>
</html>
