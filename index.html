<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu - Experiencia Auditiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  
  <style>
    body { font-family: 'Inter', sans-serif; padding-bottom: 140px; }
    .elven-bg { background: radial-gradient(circle at 50% 10%, #1c251a 0%, #0a0e09 100%); }
    .card-elven { background: linear-gradient(135deg, rgba(30, 38, 28, 0.9) 0%, rgba(20, 25, 18, 0.95) 100%); transition: transform 0.2s; }
    .card-elven:hover { transform: translateY(-4px); }
    input[type=range] { accent-color: #d97706; }
  </style>
</head>
<body class="bg-[#0a0e09] text-[#e5dcc3] min-h-screen elven-bg">

  <!-- Header -->
  <header class="border-b border-amber-900/40 bg-[#0a0e09]/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar(true)" class="p-2 rounded-lg border border-amber-800/40 hover:bg-amber-900/20 text-amber-600 transition">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <h1 class="text-xl font-black text-amber-500 tracking-wide">Nimbu</h1>
      </div>
      <div id="nodeStatus" class="text-[10px] text-amber-800 italic">Conectando...</div>
    </div>
  </header>

  <!-- Sidebar completo -->
  <div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50"></div>
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-[#0f140d] border-r border-amber-900/50 z-50 transform -translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between overflow-y-auto">
    <nav class="space-y-8">
        <div class="flex items-center gap-3 pb-6 border-b border-amber-900/30">
            <i data-lucide="leaf" class="text-amber-600"></i>
            <span class="text-lg font-bold text-amber-500">Nimbu</span>
        </div>
        <div>
            <p class="text-[10px] uppercase tracking-widest text-amber-800 mb-3 px-3">Exploración</p>
            <div class="space-y-1">
                <a href="#" onclick="loadHivePosts()" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-amber-900/10 text-amber-500 border border-amber-800/30 text-sm">
                    <i data-lucide="compass" class="w-4 h-4"></i> Explorar Crónicas
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-400 hover:text-amber-200 text-sm">
                    <i data-lucide="trending-up" class="w-4 h-4"></i> Ritmos en Auge
                </a>
            </div>
        </div>
        <div>
            <p class="text-[10px] uppercase tracking-widest text-amber-800 mb-3 px-3">Legado Personal</p>
            <div class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-400 hover:text-amber-200 text-sm">
                    <i data-lucide="user" class="w-4 h-4"></i> Mi Perfil
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-stone-400 hover:text-amber-200 text-sm">
                    <i data-lucide="gem" class="w-4 h-4"></i> Billetera Hive
                </a>
            </div>
        </div>
    </nav>
    <div class="text-[10px] text-stone-600 text-center italic border-t border-amber-900/30 pt-6">"El saber antiguo fluye eterno"</div>
  </aside>

  <!-- Feed -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-black text-amber-400 mb-6">Audios Detectados:</h2>
    <div id="feed" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <p id="loadingMsg" class="text-amber-800 animate-pulse col-span-full text-center py-20">Buscando audios compatibles en Hive...</p>
    </div>
  </main>

  <!-- Footer Player -->
  <footer class="fixed bottom-0 left-0 right-0 bg-[#0a0e09]/95 border-t border-amber-900/50 p-4 backdrop-blur-md z-40">
    <div class="max-w-4xl mx-auto flex flex-col gap-3">
        <h4 id="playerTitle" class="text-xs font-bold text-amber-500 truncate text-center">Selecciona un audio</h4>
        <div class="flex items-center justify-between gap-6">
            <div class="flex items-center gap-3">
                <button onclick="playRandom()" class="text-amber-700 hover:text-amber-400"><i data-lucide="shuffle" class="w-5 h-5"></i></button>
                <button onclick="changeTrack(-1)" class="text-amber-500 hover:text-amber-300"><i data-lucide="skip-back" class="w-5 h-5"></i></button>
                <button id="playPauseBtn" onclick="togglePlay()" class="bg-amber-600 text-black p-3 rounded-full hover:bg-amber-500"><i data-lucide="play" class="w-6 h-6"></i></button>
                <button onclick="changeTrack(1)" class="text-amber-500 hover:text-amber-300"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
            </div>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)" class="w-20">
        </div>
    </div>
    <audio id="globalAudio"></audio>
  </footer>

  <script>
    lucide.createIcons();
    let audioQueue = [];
    let currentIdx = 0;
    const player = document.getElementById('globalAudio');
    const playerTitle = document.getElementById('playerTitle');
    const playPauseBtn = document.getElementById('playPauseBtn');

    const HIVE_NODES = [
        'https://api.hive.blog',
        'https://api.openhive.network',
        'https://techcoderx.com',
        'https://hive-api.arcange.eu'
    ];

    function toggleSidebar(open) {
        document.getElementById('sidebar').classList.toggle('-translate-x-full', !open);
        document.getElementById('sidebarBackdrop').classList.toggle('hidden', !open);
    }

    async function fetchFromHive(body) {
        for (const node of HIVE_NODES) {
            try {
                const response = await fetch(node, {
                    method: 'POST',
                    body: JSON.stringify(body),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    document.getElementById('nodeStatus').innerText = `Nodo: ${new URL(node).hostname}`;
                    return await response.json();
                }
            } catch (e) {}
        }
        throw new Error("Sin respuesta de los nodos.");
    }

    // Comprobador estricto de URLs de audio válidas
    function isValidAudioUrl(url) {
        if (!url || typeof url !== 'string') return false;
        // Ignorar reproductores e incrustaciones web
        if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('3speak.tv/watch') || url.includes('soundcloud.com')) {
            return false;
        }
        // Validar formato directo de archivo de sonido
        return /\.(mp3|wav|ogg|m4a|aac)(\?.*)?$/i.test(url);
    }

    function findBestAudioUrl(post) {
        // 1. Escanear enlaces directos en el cuerpo
        const audioRegex = /(https?:\/\/[^\s"']+\.(mp3|wav|ogg|m4a|aac)(\?[^\s"']*)?)/gi;
        const bodyMatches = post.body ? post.body.match(audioRegex) : null;
        if (bodyMatches) {
            const valid = bodyMatches.find(l => isValidAudioUrl(l));
            if (valid) return valid;
        }

        // 2. Escanear metadatos
        let meta = {};
        try { meta = typeof post.json_metadata === 'string' ? JSON.parse(post.json_metadata || '{}') : post.json_metadata; } catch(e) {}
        
        if (isValidAudioUrl(meta?.audio)) return meta.audio;
        if (isValidAudioUrl(meta?.music)) return meta.music;
        if (Array.isArray(meta?.links)) {
            const found = meta.links.find(l => isValidAudioUrl(l));
            if (found) return found;
        }
        return null;
    }

    async function loadHivePosts() {
        const loadingMsg = document.getElementById('loadingMsg');
        loadingMsg.innerText = "Buscando archivos de audio válidos...";

        try {
            const tags = ["music", "audio", "podcast", "sound"];
            const requests = tags.map(tag => fetchFromHive({
                jsonrpc: "2.0",
                method: "condenser_api.get_discussions_by_created",
                params: [{ tag, limit: 25 }],
                id: 1
            }));

            const results = await Promise.allSettled(requests);
            const uniquePosts = new Map();

            results.forEach(res => {
                if (res.status === 'fulfilled' && res.value?.result) {
                    res.value.result.forEach(p => uniquePosts.set(p.permlink, p));
                }
            });

            audioQueue = Array.from(uniquePosts.values())
                .map(p => ({ ...p, audioUrl: findBestAudioUrl(p) }))
                .filter(p => !!p.audioUrl);

            if (audioQueue.length === 0) {
                loadingMsg.innerText = "No se encontraron archivos .mp3 / .wav directos en las publicaciones recientes.";
            } else {
                renderFeed(audioQueue);
            }
        } catch (e) {
            loadingMsg.innerHTML = `<span class="text-red-500">Error de conexión con la red Hive.</span>`;
        }
    }

    function renderFeed(posts) {
        document.getElementById('feed').innerHTML = posts.map(p => `
            <article class="card-elven border border-amber-900/30 rounded-xl p-3">
                <h3 class="text-[9px] text-amber-600 font-bold uppercase truncate">@${p.author}</h3>
                <h2 class="text-xs text-[#e5dcc3] mb-3 leading-tight h-8 overflow-hidden">${p.title}</h2>
                <button onclick="playTrackFromQueue('${p.permlink}')" class="w-full py-2 bg-amber-900/20 border border-amber-800 rounded-lg text-amber-500 font-bold text-xs hover:bg-amber-800">
                    REPRODUCIR
                </button>
            </article>
        `).join('');
    }

    function playTrackFromQueue(permlink) {
        const idx = audioQueue.findIndex(p => p.permlink === permlink);
        if(idx !== -1) { currentIdx = idx; playTrack(); }
    }

    function playTrack() {
        if (!audioQueue[currentIdx]) return;
        const post = audioQueue[currentIdx];
        
        player.src = post.audioUrl;
        playerTitle.innerText = `Cargando: ${post.title}`;

        player.play().then(() => {
            playerTitle.innerText = post.title;
            playPauseBtn.innerHTML = '<i data-lucide="pause" class="w-6 h-6"></i>';
            lucide.createIcons();
        }).catch(e => {
            console.warn("Reproducción requiere interacción directa:", e);
            playerTitle.innerText = `${post.title} (Presiona Play)`;
            playPauseBtn.innerHTML = '<i data-lucide="play" class="w-6 h-6"></i>';
            lucide.createIcons();
        });
    }

    // Capturar el error "NotSupportedError" o enlace caído
    player.onerror = () => {
        const err = player.error;
        console.error("Error en la fuente de audio:", err);
        playerTitle.innerText = "⚠️ Enlace incompatible o caído. Saltando al siguiente...";
        
        // Auto-saltar al siguiente track tras 2 segundos si el link no sirve
        setTimeout(() => {
            if (audioQueue.length > 1) {
                changeTrack(1);
            }
        }, 2000);
    };

    player.onended = () => changeTrack(1);

    function togglePlay() {
        if(player.paused) { 
            player.play(); 
            playPauseBtn.innerHTML = '<i data-lucide="pause" class="w-6 h-6"></i>'; 
        } else { 
            player.pause(); 
            playPauseBtn.innerHTML = '<i data-lucide="play" class="w-6 h-6"></i>'; 
        }
        lucide.createIcons();
    }

    function changeTrack(step) {
        if(audioQueue.length === 0) return;
        currentIdx = (currentIdx + step + audioQueue.length) % audioQueue.length;
        playTrack();
    }

    function playRandom() {
        if(audioQueue.length === 0) return;
        currentIdx = Math.floor(Math.random() * audioQueue.length);
        playTrack();
    }

    function setVolume(val) { player.volume = val; }

    loadHivePosts();
  </script>
</body>
</html>
