<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu - Crónicas de Audio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@hiveio/dhive@latest/dist/dhive.js"></script>
  <!-- Tipografía Élfica/Clásica -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Lora', serif; }
    
    /* Degradado de "Amanecer en Rivendell" */
    .elven-bg {
      background: radial-gradient(circle at 50% 0%, rgba(10, 50, 30, 0.8) 0%, rgba(10, 10, 10, 1) 70%);
    }

    /* Borde artesanal para tarjetas */
    .elvish-border {
      border: 1px solid rgba(180, 160, 100, 0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .gold-glow {
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    }
  </style>
</head>
<body class="bg-stone-950 text-stone-200 min-h-screen elven-bg selection:bg-amber-900/50">

  <!-- Header con acento de oro -->
  <header class="border-b border-amber-900/40 bg-stone-950/80 sticky top-0 z-40 backdrop-blur-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar(true)" class="p-2 rounded-full border border-amber-800/50 text-amber-600 hover:text-amber-400 transition active:scale-95">
          <i data-lucide="leaf" class="w-5 h-5"></i>
        </button>
        
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold tracking-widest text-amber-600 gold-glow">Nimbu</h1>
        </div>
      </div>

      <div id="authContainer">
        <button id="loginBtn" onclick="connectHiveKeychain()" class="bg-amber-900/30 border border-amber-700/50 hover:bg-amber-800/40 text-amber-200 px-5 py-2 rounded-full text-sm font-semibold transition-all flex items-center gap-2">
          <i data-lucide="gem" class="w-4 h-4"></i>
          Conectar
        </button>
      </div>
    </div>
  </header>

  <!-- MENÚ LATERAL -->
  <div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50"></div>
  
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-stone-900 border-r border-amber-900/50 z-50 transform -translate-x-full transition-transform duration-500 p-8 flex flex-col justify-between">
    <nav class="space-y-6">
      <div class="flex items-center gap-2 text-amber-500 mb-8 border-b border-amber-900 pb-4">
        <i data-lucide="crown" class="w-5 h-5"></i>
        <span class="font-bold tracking-widest">NIMBU</span>
      </div>
      <a href="#" class="block text-amber-100 hover:text-white transition">Explorar las Crónicas</a>
      <a href="#" class="block text-stone-400 hover:text-amber-200 transition">Mi Perfil</a>
      <a href="#" class="block text-stone-400 hover:text-amber-200 transition">Mis Partituras</a>
    </nav>
    <div class="text-stone-600 text-xs italic">"No todo lo que es oro reluce..."</div>
  </aside>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-10 text-center">
        <h2 class="text-3xl text-amber-500 mb-2 font-light tracking-wide">Archivos de Sonido</h2>
        <div class="w-24 h-px bg-amber-700 mx-auto"></div>
    </div>

    <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-20 text-stone-500 italic">
          <i data-lucide="sparkles" class="w-8 h-8 mx-auto mb-4 animate-pulse"></i>
          Consultando los registros antiguos...
        </div>
    </div>
  </main>

  <!-- Botón Flotante -->
  <button id="fabPublish" onclick="toggleModal(true)" class="hidden fixed bottom-8 right-8 bg-amber-700 text-stone-900 p-5 rounded-full shadow-2xl z-40 hover:scale-105 transition-all border border-amber-500">
    <i data-lucide="feather" class="w-6 h-6"></i>
  </button>

  <script>
    lucide.createIcons();
    let currentUser = localStorage.getItem('nimbu_user');
    
    const hiveClient = new dhive.Client([
      'https://api.hive.blog',
      'https://api.deathwing.me',
      'https://hive-api.arcange.eu'
    ], { timeout: 4000 });

    if (currentUser) setSession(currentUser);
    loadHivePosts();

    function toggleSidebar(open) {
        document.getElementById('sidebar').classList.toggle('-translate-x-full', !open);
        document.getElementById('sidebarBackdrop').classList.toggle('hidden', !open);
    }

    async function loadHivePosts() {
        try {
            const posts = await hiveClient.database.getDiscussions('created', { tag: 'music', limit: 12 });
            renderPosts(posts);
        } catch (err) {
            console.error(err);
        }
    }

    function renderPosts(posts) {
        const feedElement = document.getElementById('feed');
        feedElement.innerHTML = posts.map(post => {
            let img = 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=400';
            try {
                const meta = typeof post.json_metadata === 'string' ? JSON.parse(post.json_metadata) : post.json_metadata;
                if (meta && meta.image && meta.image[0]) img = meta.image[0];
            } catch(e) {}

            return `
              <article class="bg-stone-900/60 elvish-border rounded-lg p-4 transition-all hover:bg-stone-800/80 group">
                <div class="overflow-hidden rounded mb-4">
                  <img src="${img}" class="w-full h-40 object-cover opacity-80 group-hover:opacity-100 transition duration-500">
                </div>
                <h3 class="text-amber-500 text-xs tracking-widest uppercase mb-1">@${post.author}</h3>
                <h2 class="text-lg font-semibold text-stone-100 mb-4 line-clamp-2">${post.title}</h2>
                <div class="flex justify-between items-center border-t border-amber-900/30 pt-4">
                   <span class="text-stone-500 text-xs">✨ ${post.active_votes?.length || 0}</span>
                   <a href="https://hive.blog/@${post.author}/${post.permlink}" target="_blank" class="text-amber-600 hover:text-amber-400 text-sm font-bold flex items-center gap-1">
                     Escuchar
                   </a>
                </div>
              </article>
            `;
        }).join('');
        lucide.createIcons();
    }

    function setSession(user) {
      currentUser = user;
      document.getElementById('authContainer').innerHTML = `<span class="text-amber-500 text-sm italic">@${user}</span>`;
      document.getElementById('fabPublish').classList.remove('hidden');
    }

    function connectHiveKeychain() {
      const u = prompt('Nombre de usuario de Hive:');
      if (u) { localStorage.setItem('nimbu_user', u.toLowerCase()); setSession(u.toLowerCase()); }
    }
  </script>
</body>
</html>
